<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>tic_tac_toe_game</title>
  </head>
  <body>
    <div class="container">
      <div class="title">
        <p>_Tic-Tac-Toe<span>_JS_</span></p>
      </div>
      <div class="board">
        <div class="row1">
          <div cellIndex="0" class="box"></div>
          <div cellIndex="1" class="box"></div>
          <div cellIndex="2" class="box"></div>
        </div>
        <div class="row2">
          <div cellIndex="3" class="box"></div>
          <div cellIndex="4" class="box"></div>
          <div cellIndex="5" class="box"></div>
        </div>
        <div class="row3">
          <div cellIndex="6" class="box"></div>
          <div cellIndex="7" class="box"></div>
          <div cellIndex="8" class="box"></div>
        </div>
        <h2 id="statusText"></h2>
        <div class="bnt">
          <button class="reset">Reset</button>
        </div>
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
